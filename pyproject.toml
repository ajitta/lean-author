[project]
name = "lean-author-dev"
version = "0.0.0"
description = "Development tooling for the lean-author plugin (not published)"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
